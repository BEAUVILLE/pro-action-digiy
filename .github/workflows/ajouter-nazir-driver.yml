name: Ajouter Nazir Driver à ACTION PRO

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ajouter-nazir-driver.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Ajouter la fiche directe Nazir Driver
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          src = path.read_text(encoding="utf-8")
          marker_id = 'id:"nazir-driver"'

          if marker_id not in src:
              marker = "  const FICHES_DIRECTES = [\n"
              card = '''    {
              id:"nazir-driver",
              kind:"directory",
              public:true,
              priority:120,
              priorite:120,
              icon:"🚗",
              title:"Nazir Driver — Chauffeur Saly · Mbour · AIBD",
              titre:"Nazir Driver — Chauffeur Saly · Mbour · AIBD",
              nom:"Nazir Driver",
              metier:"chauffeur",
              activite:"Trajets directs · Transferts aéroport · Déplacements régionaux",
              categorie:"DRIVER",
              sousCategorie:"chauffeur-prive",
              secteur:"Saly · Mbour · AIBD · Multi-région",
              zoneAffichage:"Saly · Mbour · AIBD · Multi-région",
              zones:["Saly","Mbour","AIBD","Petite Côte","Multi-région","Sénégal"],
              statut:"fiche_driver_publique",
              labelStatut:"Fiche officielle DIGIY DRIVER",
              phone:"221778310298",
              whatsapp:"221778310298",
              keys:["nazir","nazir driver","chauffeur","chauffeur privé","chauffeur prive","driver","taxi","transport","trajet","course","transfert","aéroport","aeroport","aibd","saly","mbour","petite côte","petite cote","multi région","multi-region","mise à disposition","mise a disposition"],
              mots:["nazir","nazir driver","chauffeur","chauffeur privé","chauffeur prive","driver","taxi","transport","trajet","course","transfert","aéroport","aeroport","aibd","saly","mbour","petite côte","petite cote","multi région","multi-region","mise à disposition","mise a disposition"],
              description:"Nazir Driver est disponible à Saly, Mbour, AIBD et multi-région pour les trajets directs, transferts aéroport, déplacements régionaux et mises à disposition. Contact direct par téléphone ou WhatsApp.",
              url:"https://galerie-chauffeurs.digiylyfe.com/nazir-driver.html",
              wa:"Bonjour Nazir Driver, je viens de DIGIYLYFE et je souhaite organiser un trajet."
            },
'''
              if marker not in src:
                  raise SystemExit("Tableau FICHES_DIRECTES introuvable")
              src = src.replace(marker, marker + card, 1)

              response_marker = '''      if(titleClean.includes("solaire")){'''
              response = '''      if(titleClean.includes("nazir")){
                return en
                  ? "I understood: you are looking for a driver in Saly, Mbour or AIBD. I bring up Nazir Driver with direct WhatsApp contact."
                  : "J’ai compris : tu cherches un chauffeur à Saly, Mbour ou pour AIBD. Je te remonte Nazir Driver avec son contact WhatsApp direct.";
              }
'''
              if response_marker in src and 'titleClean.includes("nazir")' not in src:
                  src = src.replace(response_marker, response + response_marker, 1)

              src = src.replace('content="action-pro-7lang-monofichier-20260731-v4-4-astou-direct"', 'content="action-pro-nazir-driver-20260801"', 1)
              path.write_text(src, encoding="utf-8")
          PY

      - name: Publier ACTION PRO
        run: |
          git config user.name "DIGIYLYFE Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Nazir Driver est déjà présent dans ACTION PRO."
          else
            git commit -m "Ajouter Nazir Driver à ACTION PRO"
            git push
          fi
