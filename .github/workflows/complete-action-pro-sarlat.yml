name: Complete ACTION PRO with Sarlat

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/complete-action-pro-sarlat.yml

permissions:
  contents: write

jobs:
  complete-sarlat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply Sarlat completion
        run: python .github/scripts/complete_action_pro_sarlat.py

      - name: Commit completed ACTION PRO
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/complete-action-pro-sarlat.yml
          rm .github/scripts/complete_action_pro_sarlat.py
          git add index.html annuaire-public-digiy.js .github/workflows/complete-action-pro-sarlat.yml .github/scripts/complete_action_pro_sarlat.py
          git commit -m "Complete ACTION PRO with Sarlat territory and direct cards"
          git push
