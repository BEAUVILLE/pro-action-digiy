name: Install subscription gate once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply subscription gate
        run: python3 tools/install-subscription-gate.py

      - name: Commit clean result
        run: |
          git config user.name "DIGIY LYFE"
          git config user.email "baptistejb24@gmail.com"
          git add index.html
          git rm tools/install-subscription-gate.py
          git rm .github/workflows/install-subscription-gate-once.yml
          git commit -m "Branche LA VOIX sur le statut de cotisation Supabase"
          git push
