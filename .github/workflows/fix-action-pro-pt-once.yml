name: Fix ACTION PRO Portuguese once

on:
  push:
    paths:
      - .github/workflows/fix-action-pro-pt-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and verify patch
        run: python tools/fix-action-pro-pt-once.py
      - name: Commit and clean temporary files
        run: |
          git config user.name "DIGIYLYFE Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/fix-action-pro-pt-once.yml tools/fix-action-pro-pt-once.py
          git add index.html
          git commit -m "fix: align ACTION PRO with 8-language DIGIYLYFE promise [skip ci]"
          git push
