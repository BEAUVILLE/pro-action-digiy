name: Ajouter retour DIGIYLYFE

on:
  push:
    paths:
      - '.github/workflows/add-retour-digiy.yml'

permissions:
  contents: write

jobs:
  patch-index:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajouter le retour visible
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'data-digiy-return-home="1"' not in s:
              block = '''<a data-digiy-return-home="1" href="https://digiylyfe.com/" aria-label="Retour à DIGIYLYFE" style="position:relative;z-index:9999;display:flex;align-items:center;justify-content:center;gap:12px;width:min(560px,calc(100% - 24px));min-height:66px;box-sizing:border-box;margin:10px auto 4px;padding:12px 18px;border:3px solid #f6c453;border-radius:18px;background:linear-gradient(135deg,#073f32,#0b5d48);color:#fff;text-decoration:none;font:950 18px/1.05 system-ui,-apple-system,'Segoe UI',sans-serif;box-shadow:0 8px 22px rgba(7,63,50,.28);-webkit-tap-highlight-color:transparent"><span aria-hidden="true" style="font-size:30px;line-height:1;color:#f6c453">←</span><span style="display:flex;flex-direction:column;align-items:flex-start;gap:3px"><strong>RETOUR DIGIYLYFE.COM</strong><small style="font-size:10px;line-height:1.1;letter-spacing:.10em;color:#fff2bf">ACCUEIL PRINCIPAL</small></span></a>'''
              s = s.replace('<body>', '<body>\n' + block, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Mieux marquer le retour DIGIYLYFE"
            git push
          fi
