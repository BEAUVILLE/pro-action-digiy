name: LA VOIX WORLD8 regression
on:
  pull_request:
    paths:
      - 'index.html'
      - 'voice-terrain-dictionary-v1.js'
      - 'voice-territory-intent-filter-v1.js'
      - 'action-pro-health-route-v1.js'
      - 'tests/voice-*.test.cjs'
      - '.github/workflows/voice-world8.yml'
  push:
    branches: ['feat/voice-terrain-dictionary']
permissions:
  contents: read
jobs:
  deterministic-world8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: WORLD8 expansions and collisions
        run: node tests/voice-world8.test.cjs
      - name: Terrain and privacy regressions
        run: node tests/voice-terrain.test.cjs
      - name: PAP Piscine terrain routing
        run: node tests/voice-pap-terrain.test.cjs
      - name: PAP pool vs plumber collision
        run: node tests/voice-pap-filter-collision.test.cjs
      - name: PAP example labels
        run: node tests/pap-example-label-fix.test.cjs
      - name: JavaScript syntax
        run: |
          node --check voice-terrain-dictionary-v1.js
          node --check voice-territory-intent-filter-v1.js
          node --check action-pro-health-route-v1.js
          node --check sw.js
