name: Finalize Sarlat zone guard

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-sarlat-zone.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/finalize_sarlat_zone.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/finalize-sarlat-zone.yml
          rm .github/scripts/finalize_sarlat_zone.py
          git add index.html .github/workflows/finalize-sarlat-zone.yml .github/scripts/finalize_sarlat_zone.py
          git commit -m "Finalize ACTION PRO Sarlat territory routing"
          git push
